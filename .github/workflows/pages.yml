# Teste le moteur puis publie le jeu sur GitHub Pages à chaque push sur main.
# Réglage requis côté dépôt : Settings → Pages → Source : « GitHub Actions ».
name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests du moteur
        run: node --test

      # Seuls les fichiers du jeu sont publiés (ni tests, ni outils).
      - name: Préparer le site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js icons _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
